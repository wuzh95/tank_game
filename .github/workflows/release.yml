name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: Build executable
        run: >
          uv run --python 3.12 pyinstaller
          --name tank-game
          --onefile
          --windowed
          --add-data "tank_battle/assets;tank_battle/assets"
          --collect-all pygame
          tank_battle/main.py

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path dist/tank-game.exe -DestinationPath dist/tank-game-windows.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tank-game-windows
          path: dist/tank-game-windows.zip

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tank-game-windows.zip

