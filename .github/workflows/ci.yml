name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev

      - name: Run lint
        run: uv run --python 3.12 ruff check .

      - name: Run tests
        run: uv run --python 3.12 pytest

